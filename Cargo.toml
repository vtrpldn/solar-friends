[package]
name = "solar-friends"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_app = { version = "0.16", default-features = false }
bevy_ecs = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.100"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

# Native/WASM iteration keeps optimization without the release link-time pass.
[profile.iteration]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true
