name: Check game
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch makes the older run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the game
        timeout-minutes: 45
        run: node scripts/check.mjs --syntax
        env:
          REALISM_SCREENSHOTS: artifacts/check-evidence/realism
          LAB_SCREENSHOTS: artifacts/check-evidence/lab
          SOLAR_EVIDENCE_DIR: artifacts/check-evidence/residents
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: check
          path: |
            artifacts/check/
            artifacts/check-evidence/
          retention-days: 7
