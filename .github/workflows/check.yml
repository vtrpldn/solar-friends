name: Check game
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check resident decisions and desktop profiles
        timeout-minutes: 15
        run: |
          node scripts/verify-v02-personality.mjs
          node scripts/verify-v02-resident-agency.mjs
          node scripts/verify-v02-downtime.mjs
          node scripts/verify-v02-expressive-motion.mjs
          node scripts/verify-v02-needs.mjs
          node scripts/verify-v02-urgent-needs.mjs
          node scripts/verify-v02-resident-agency-browser.mjs
      - run: npm run dev:check -- --v2
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: development-check
          path: artifacts/dev-check/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: solar-friends-browser
          path: web/
          retention-days: 7
