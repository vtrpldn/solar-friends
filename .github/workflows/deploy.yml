name: Deploy site
# Builds the site here and uploads the finished dist/ to Netlify. An upload of a built site uses
# no Netlify build minutes. Netlify's own builds should be stopped in its site settings
# (Build & deploy → Stop builds) so pushes don't spend minutes twice.
#
# Needs repository secrets NETLIFY_AUTH_TOKEN (a personal access token) and NETLIFY_SITE_ID
# (Site configuration → Site ID).
#
# The deploy doesn't wait for the "Check game" workflow; a push to main is published as soon as it builds.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Only the newest push matters; an older deploy still running is cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build-site.mjs uses only Node built-ins, so no npm ci; it stamps GITHUB_SHA into build-info.js.
      - run: npm run build:site
      - name: Upload to Netlify
        run: >-
          npx --yes netlify-cli@27.16.3 deploy --prod --no-build --dir=dist
          --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
