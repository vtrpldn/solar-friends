name: Check Bevy desktop game

on:
  push:
    branches: [main]
    paths:
      - 'bevy-v3/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/bevy-v3.yml'
      - 'scripts/package-bevy-macos.sh'
  pull_request:
    paths:
      - 'bevy-v3/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/bevy-v3.yml'
      - 'scripts/package-bevy-macos.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bevy-v3
      - run: cargo fmt --manifest-path bevy-v3/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path bevy-v3/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path bevy-v3/Cargo.toml
      - name: Run the standalone simulation tool
        run: |
          cargo build --locked --manifest-path bevy-v3/Cargo.toml
          standalone=$(mktemp -d)
          cp bevy-v3/target/debug/solar-friends-v3 "$standalone/"
          cd "$standalone"
          cat > scenario.json <<'JSON'
          {
            "steps": 20000,
            "orders": [
              {"step": 0, "order": {"type": "build", "key": "gathering", "x": 40, "z": 36}},
              {"step": 8000, "order": {"type": "move", "site": 1, "x": 49, "z": 36}},
              {"step": 12000, "order": {"type": "salvage", "site": 1}}
            ]
          }
          JSON
          ./solar-friends-v3 --lab scenario.json > report.json
          jq -e '
            .end_step == 20000
            and .orders == [
              {"step": 0, "error": null},
              {"step": 8000, "error": null},
              {"step": 12000, "error": null}
            ]
            and (.village.construction.plans | length == 1)
            and (.village.construction.plans[0] |
              .key == "gathering" and .loads == 3 and .delivered == 3
              and .staged == 0 and .work == 134 and .position == [49, 36]
              and .removed == true)
            and (.village.construction.building_history | map(del(.clock))) == [{
              "key": "gathering", "kind": "Salvage", "recovered": {"wood": 4},
              "lost": {"hardware": 1, "wood": 4}
            }]
            and .village.stock.materials.wood == 32
          ' report.json
          ./solar-friends-v3 --lab-replay report.json
      - name: Package the macOS desktop game
        run: >-
          bash scripts/package-bevy-macos.sh
          bevy-v3/target/debug/solar-friends-v3
          "dist/solar-friends-v3-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: solar-friends-v3-macos
          path: dist/solar-friends-v3-macos-*.zip
          if-no-files-found: error
