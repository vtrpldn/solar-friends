[package]
name = "solar-friends-v3"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["3d", "ui"] }
glam = { version = "0.30", features = ["serde"] }
rfd = "0.17"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
