[package]
name = "solar-friends-v3"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["3d", "ui"] }
glam = { version = "0.30", features = ["serde"] }
rfd = "0.17"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bevy-inspector-egui = { version = "0.36", optional = true }

# Iteration features for local development only. Release, CI and the web build leave
# them off. `scripts/v3-dev.sh` picks the right combination; see docs/iteration.md.
[features]
# Live asset reloading, the remote protocol, UI layout outlines and frame overlays.
dev-tools = [
    "bevy/bevy_dev_tools",
    "bevy/bevy_remote",
    "bevy/bevy_ui_debug",
    "bevy/embedded_watcher",
    "bevy/file_watcher",
    "bevy/track_location",
]
# Fastest relinks: Bevy as a shared library.
dev = ["dev-tools", "bevy/dynamic_linking"]
# Patch system bodies into the running game through `dx serve --hot-patch`.
hot = ["dev-tools", "bevy/hotpatching"]
# An egui window that browses and edits entities, components and resources live.
inspector = ["dev-tools", "dep:bevy-inspector-egui"]

# The web build renders through WebGPU in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["3d", "ui", "webgpu"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlDocument",
    "HtmlTextAreaElement",
    "HtmlAnchorElement",
    "CssStyleDeclaration",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
js-sys = "0.3"

# Optimize dependencies in debug builds: Bevy runs smoothly while the game's own code
# keeps quick incremental rebuilds. Dependencies only recompile when they change.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
