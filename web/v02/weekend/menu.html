<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solar Friends</title>
    <script type="importmap">
      { "imports": { "three": "../workshop/vendor/three.module.js" } }
    </script>
    <link rel="stylesheet" href="weekend.css" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <canvas id="menu-landscape" aria-hidden="true"></canvas>
    <main class="start-menu">
      <header class="menu-title">
        <small>A LITTLE LAND. A LIFE TOGETHER.</small>
        <h1>Solar Friends</h1>
      </header>
      <div class="menu-choices">
        <button id="continue-game" hidden>
          <strong>Continue</strong
          ><span id="continue-label" class="save-detail"></span></button
        ><button data-start="story">
          <strong>New game</strong
          ><span
            >A fresh plot of land. A few friends. Your own way forward.</span
          ></button
        ><button data-start="sandbox">
          <strong>New sandbox</strong
          ><span
            >Room to experiment. Everything available, without the costs.</span
          ></button
        ><button id="continue-sandbox" hidden>
          <strong>Continue sandbox</strong
          ><span>Return to your saved playground.</span>
        </button>
      </div>
      <p class="hint">Made for growing together · v0.2</p>
      <a href="../library/">Browse the art collection ↗</a>
      <p id="menu-status" role="status"></p>
    </main>
    <dialog id="replace-save">
      <h2>Start a fresh village?</h2>
      <p id="replace-copy"></p>
      <button id="cancel-new">Keep my village</button
      ><button id="confirm-new">Start fresh</button>
    </dialog>
    <script type="module" src="menu.js"></script>
    <script type="module" src="menu-scene.js"></script>
  </body>
</html>
