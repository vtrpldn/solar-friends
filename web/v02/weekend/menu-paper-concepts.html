<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solar Friends · Menu directions</title>
    <script type="importmap">
      { "imports": { "three": "../workshop/vendor/three.module.js" } }
    </script>
    <link rel="stylesheet" href="weekend.css" />
    <link rel="stylesheet" href="menu-concepts.css" />
  </head>
  <body>
    <iframe id="concept" title="Main menu design preview"></iframe>
    <nav class="concept-picker" aria-label="Menu design variations">
      <div>
        <small>ART DIRECTION</small><strong>Choose your welcome</strong>
      </div>
      <div class="concept-tabs">
        <button data-concept="1">01 · Seed Packet</button
        ><button data-concept="2">02 · Postmarked</button
        ><button data-concept="3">03 · Sunprint</button
        ><button data-concept="4">04 · Terracotta</button
        ><button data-concept="5">05 · Quiet Green</button>
      </div>
      <p id="description"></p>
    </nav>
    <script type="module">
      const descriptions = [
        "A seed-packet cover: bold lettering, a simple sprout and warm paper.",
        "An actual postcard: a botanical stamp, a handwritten note and a divided back.",
        "A deep-blue botanical print, with the menu on a narrow cream strip.",
        "Clay-colored paper, a large sun emblem and a compact centered menu.",
        "A quiet green cover with a fine border, small botanical mark and generous type.",
      ];
      function show(n) {
        document.querySelector("#concept").src = `menu-paper.html?concept=${n}`;
        document
          .querySelectorAll("[data-concept]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(+b.dataset.concept === n)),
          );
        document.querySelector("#description").textContent =
          descriptions[n - 1];
        history.replaceState(null, "", `?concept=${n}`);
      }
      document
        .querySelectorAll("[data-concept]")
        .forEach((b) => (b.onclick = () => show(+b.dataset.concept)));
      show(
        Math.max(
          1,
          Math.min(
            5,
            Number(new URLSearchParams(location.search).get("concept")) || 1,
          ),
        ),
      );
    </script>
  </body>
</html>
