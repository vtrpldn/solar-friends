<header><strong>Resident lineup</strong><label>Pose <select id="pose"><option>idle</option><option>walk</option><option>sit</option><option>water</option><option>tend</option><option>carry</option><option>rest</option><option>eat</option><option>wash</option><option>bathe</option><option>pee</option><option>toilet</option><option>chat</option><option>read</option><option>play</option><option>stretch</option></select></label></header><canvas></canvas><footer><span>Resident</span><span>Iara</span><span>Bento</span><span>Luz</span><span>Cauã</span><span>Nina</span></footer>
<script type="module">
import * as THREE from 'three';
import {createResident,animateResident,RESIDENT_IDS} from './rig.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9ddbd');
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const camera=new THREE.OrthographicCamera(-5,5,2.3,-2.3,.1,100);camera.position.set(0,4,10);camera.lookAt(0,.8,0);
scene.add(new THREE.HemisphereLight(0xfff4d8,0x718253,2));const sun=new THREE.DirectionalLight(0xffe5bd,3);sun.position.set(-4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-7,right:7,top:5,bottom:-5});scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0xbcc48c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.03;scene.add(ground);
const residents=RESIDENT_IDS.map((id,i)=>{const r=createResident(id);r.position.x=(i-2.5)*1.6;r.rotation.y=.3;scene.add(r);return r;});
function resize(){const w=innerWidth,h=Math.min(620,innerHeight-194);renderer.setSize(w,h);camera.left=-5.1;camera.right=5.1;camera.top=5.1*h/w;camera.bottom=-camera.top;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
const pose=document.querySelector('#pose');let last=0,clock=0;renderer.setAnimationLoop(t=>{const dt=last?Math.min(.05,(t-last)/1000):0;last=t;clock+=dt;for(const r of residents)animateResident(r.rig,pose.value,clock,dt);renderer.render(scene,camera);});
</script></html>
