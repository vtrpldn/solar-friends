<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solar Friends · 3D collection</title>
    <script type="importmap">
      { "imports": { "three": "../workshop/vendor/three.module.js" } }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e4e7d3;
        color: #35493e;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        background: #faf7ea;
        z-index: 1;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        gap: 18px;
        box-shadow: 0 3px 12px #243a2512;
      }
      h1 {
        font: 26px Georgia;
        margin: 0 auto 0 0;
      }
      a {
        color: #47604b;
      }
      select,
      button {
        padding: 9px;
        border: 1px solid #bfc9af;
        border-radius: 6px;
        background: #f8f5e9;
        color: inherit;
        font: inherit;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
        gap: 16px;
        padding: 24px;
      }
      article {
        background: #f8f5e9;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #cbd2bb;
      }
      article img {
        width: 100%;
        display: block;
        aspect-ratio: 1;
      }
      article a {
        display: block;
        text-decoration: none;
      }
      h2 {
        font: 19px Georgia;
        margin: 13px 16px 6px;
      }
      p {
        font-size: 11px;
        margin: 0 16px 16px;
        color: #74806b;
      }
      .note {
        padding: 12px 28px;
        margin: 0;
        background: #d7dfc4;
      }
      button:disabled {
        opacity: 0.5;
      }
      a:focus-visible,
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #436f55;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>The 3D collection</h1>
      <select id="category" aria-label="Asset category">
        <option value="">All categories</option></select
      ><button id="scale" aria-pressed="false">Enlarge small props</button
      ><button id="turn">Rotate all 90°</button
      ><a href="../land/">Edit the land ↗</a>
    </header>
    <p class="note" id="status">Rendering the collection…</p>
    <main id="cards"></main>
    <script type="module" src="review.js"></script>
  </body>
</html>
